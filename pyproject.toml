[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motifmultiverse"
version = "0.1.0.dev0"
description = "Bias-aware harmonization and robust inference of attribution-derived regulatory motifs across models and methods."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["regulatory-genomics", "motifs", "attribution", "tf-modisco", "multiverse-analysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "h5py>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Adapter backends. Deliberately NOT core dependencies: a missing backend must
# produce a clear "backend not installed" error, never an ImportError traceback.
finemo = ["finemo-gpu>=0.30"]
fimo = []       # MEME suite is an external binary; see docs/ARCHITECTURE.md
viz = ["matplotlib>=3.7", "logomaker>=0.8"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
motifmultiverse = "motifmultiverse.cli:main"

[project.urls]
Documentation = "./docs/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motifmultiverse = ["*/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
