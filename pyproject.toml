[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motifmultiverse"
version = "0.1.0.dev0"
description = "Bias-aware harmonization and robust inference of attribution-derived regulatory motifs across models and methods."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["regulatory-genomics", "motifs", "attribution", "tf-modisco", "multiverse-analysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "h5py>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Adapter backends. Deliberately NOT core dependencies: a missing backend must
# produce a clear "backend not installed" error, never an ImportError traceback.
#
# The distribution is `finemo`, not `finemo-gpu`. `finemo-gpu` is the GitHub
# project's name (kundajelab/Fi-NeMo, formerly austintwang/finemo_gpu) and is not
# a PyPI distribution at all -- `pip install finemo-gpu` fails with "No matching
# distribution found" -- so this extra could not be installed, the round-trip test
# skipped everywhere including CI, and the one thing `compile` exists to
# guarantee went unchecked. `tests/test_ingest_compile.py::
# test_the_declared_finemo_extra_names_the_distribution_that_provides_the_backend`
# holds the name to the distribution that actually supplies the import.
#
# No upper pin: 0.30 and 0.41 spell the loader's trim-threshold argument
# differently, and `compile._loader_call_kwargs` binds to whichever is installed
# and refuses a signature it does not recognise, which is a better failure than a
# pin that goes stale unread.
finemo = ["finemo>=0.30"]
fimo = []       # MEME suite is an external binary; see docs/ARCHITECTURE.md
viz = ["matplotlib>=3.7", "logomaker>=0.8"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
motifmultiverse = "motifmultiverse.cli:main"

[project.urls]
Documentation = "./docs/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motifmultiverse = ["*/README.md", "adjudicate/criteria.v1.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
