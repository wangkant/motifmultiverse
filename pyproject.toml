[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motifmultiverse"
version = "0.1.0.dev0"
description = "Bias-aware harmonization and robust inference of attribution-derived regulatory motifs across models and methods."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# No e-mail address: `tests/test_status.py::test_no_published_file_carries_a_local_
# path_or_identity` scans every tracked file for one, and PyPI would publish it.
# `CITATION.cff` carries the ORCID, which is the durable identifier anyway.
authors = [{ name = "Qiankang Wang" }]
keywords = ["regulatory-genomics", "motifs", "attribution", "tf-modisco", "multiverse-analysis"]
# One rule for both axes: a classifier nothing runs is a claim, not a fact, so
# this names exactly what the `core` matrix executes. macOS is deliberately
# absent. It is not known broken -- `ctypes.CDLL(None)` works there and the
# absence of `renameat2` sends it down the symlink publish fallback -- but that
# is a code path no job has ever run, and claiming it would be the same
# unverified-reads-as-verified shape the Python entries were added to end.
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "h5py>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Adapter backends. Deliberately NOT core dependencies: a missing backend must
# produce a clear "backend not installed" error, never an ImportError traceback.
#
# The distribution is `finemo`, not `finemo-gpu`. `finemo-gpu` is the GitHub
# project's name (kundajelab/Fi-NeMo, formerly austintwang/finemo_gpu) and is not
# a PyPI distribution at all -- `pip install finemo-gpu` fails with "No matching
# distribution found" -- so this extra could not be installed, the round-trip test
# skipped everywhere including CI, and the one thing `compile` exists to
# guarantee went unchecked. `tests/test_ingest_compile.py::
# test_the_declared_finemo_extra_names_the_distribution_that_provides_the_backend`
# holds the name to the distribution that actually supplies the import.
#
# No upper pin: 0.30 and 0.41 spell the loader's trim-threshold argument
# differently, and `compile._loader_call_kwargs` binds to whichever is installed
# and refuses a signature it does not recognise, which is a better failure than a
# pin that goes stale unread.
finemo = ["finemo>=0.30"]
fimo = []       # MEME suite is an external binary; see docs/ARCHITECTURE.md
viz = ["matplotlib>=3.7", "logomaker>=0.8"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
motifmultiverse = "motifmultiverse.cli:main"
# Short alias. Same callable, not a wrapper: a wrapper is a second place for the
# argument surface to drift. `cli.main` reports whichever name it was invoked by,
# so `mmv --help` does not print usage for a command the reader did not type.
mmv = "motifmultiverse.cli:main"

[project.urls]
# Absolute, because these are rendered on a package index and nowhere near the
# repository. `Documentation = "./docs/"` resolved against pypi.org, where it
# means nothing at all.
Homepage = "https://github.com/wangkant/motifmultiverse"
Repository = "https://github.com/wangkant/motifmultiverse"
Documentation = "https://github.com/wangkant/motifmultiverse/tree/main/docs"
Issues = "https://github.com/wangkant/motifmultiverse/issues"
Changelog = "https://github.com/wangkant/motifmultiverse/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# Data the CODE reads, and therefore data the wheel must contain. Every entry
# here is checked by `tests/test_packaging.py`, which resolves each one through
# `importlib.resources` -- the way the code reaches it -- rather than by looking
# for a file in the source tree, where it is present whether or not it ships.
#
# `report/bias_ledger.tsv` is the one that was missing: the ledger lived in
# `docs/`, `report`'s default pointed at it by walking up from `__file__`, and so
# `motifmultiverse report interpretation/` refused on every non-editable install
# for a file the wheel had never been asked to carry.
[tool.setuptools.package-data]
motifmultiverse = [
  "*/README.md",
  "adjudicate/criteria.v1.yaml",
  "adjudicate/criteria.v2.yaml",
  "report/bias_ledger.tsv",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
